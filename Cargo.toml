[workspace]
resolver = "3"
members = [
    "apps/zettings",
    "crates/zettings-core",
    "crates/zettings-ipc",
    "crates/zettings-bus",
    "crates/zettings-polkit",
    "crates/zettings-plugin-sdk",
    "crates/zettings-search",
    "crates/zettings-backends",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zyntrix-os/zettings"
authors = ["Zyntrix OS contributors"]
publish = false

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
missing_docs = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Deliberate ergonomic allows (see AGENTS.md §8); everything else in pedantic is denied.
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
missing_fields_in_debug = { level = "allow", priority = 1 }
# Tauri pulls duplicate transitive versions we cannot deduplicate without forking.
multiple_crate_versions = { level = "allow", priority = 1 }

# ---------------------------------------------------------------------------
# Shared dependency versions — pinned once, inherited via `dep.workspace = true`.
# Phase 1 carries only dependencies with an immediate architectural consumer;
# Linux integration dependencies (zbus, pipewire, ...) arrive with their
# adapter crates in PLAN Phase 5 so Windows-host builds stay fast.
# ---------------------------------------------------------------------------

[workspace.dependencies]
# Serialization / IPC types
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ts-rs: generates TypeScript bindings from Rust types consumed by the frontend.
ts-rs = { version = "12.0", features = ["no-serde-warnings"] }

# Error handling
thiserror = "2.0"

# Async runtime / messaging
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
async-trait = "0.1"

# Logging / diagnostics
tracing = "0.1"

# Fuzzy string distance for search ranking
strsim = "0.11"

# Crypto: ed25519 module signature verification (plugin-sdk)
ring = "0.17"
base64 = "0.22"
hex = "0.4"

# Native helpers
indexmap = { version = "2.10", features = ["serde"] }

# Testing
proptest = "1.5"
tempfile = "3"

# Internal workspace crates — referenced by path; version synced via [workspace.package].
zettings-core = { path = "crates/zettings-core" }
zettings-ipc = { path = "crates/zettings-ipc" }
zettings-bus = { path = "crates/zettings-bus" }
zettings-polkit = { path = "crates/zettings-polkit" }
zettings-plugin-sdk = { path = "crates/zettings-plugin-sdk" }
zettings-search = { path = "crates/zettings-search" }
zettings-backends = { path = "crates/zettings-backends" }

# ---------------------------------------------------------------------------
# Profile tuning — small release binary, fast dev cycle.
# ---------------------------------------------------------------------------
[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
debug = "line-tables-only"
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
