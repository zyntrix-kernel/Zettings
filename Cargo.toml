[workspace]
resolver = "3"
members = [
    "crates/zettings-core",
    "crates/zettings-search",
    "crates/zettings-polkit",
    "crates/zettings-backends",
]
# zettings-bridge is excluded: cxx-qt 0.10.0 emits an
# `unsafe extern { include!(<QtCore/QObject>) }` internally, which rustc 1.97
# rejects ("non-foreign item macro in foreign item position"). Re-join once
# upstream releases a 1.97-compatible gen, or after evaluating a pinned
# pre-restriction toolchain for the whole workspace.
exclude = [
    "crates/zettings-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Zyntrix/Zettings"

[workspace.dependencies]
zettings-core = { path = "crates/zettings-core", version = "0.1.0" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_fields_in_debug = "allow"
multiple_crate_versions = "allow"
