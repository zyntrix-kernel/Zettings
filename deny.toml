# cargo-deny configuration — enforces the Zettings license & security policy.
# Run: `cargo deny check` (GitHub Actions enforces this in CI).

[graph]
# Lockfile is committed; deny-checks run against it.
all-features = false
# Default features only: each crate's mock/zbus/pipewire feature gates are audited separately.

[advisories]
version = 2
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0370: proc-macro-error is unmaintained. Transitive via glib-macros
    # (GTK3 stack, pulled by tauri's Linux runtime). No safe upgrade exists.
    # Unmaintained only, no active CVE. Tracked: Zyntrix security review 2026-08.
    "RUSTSEC-2024-0370",
    # RUSTSEC-2024-0411..0420: gtk-rs GTK3 bindings (atk/gdk/gdkx11/gtk families) are
    # archived upstream. Transitive via tauri -> muda/tao/wry/webkit2gtk on Linux.
    # No safe upgrade (Tauri v2 still depends on GTK3). Unmaintained only, no active CVE.
    # Tracked: Zyntrix security review 2026-08.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # RUSTSEC-2025-0075, 0080, 0081, 0098, 0100: rust-unic crates are unmaintained.
    # Transitive via urlpattern in tauri-utils. No safe upgrade exists.
    # Unmaintained only, no active CVE. Tracked: Zyntrix security review 2026-08.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]

[licenses]
version = 2
# Allow permissive OSI licenses compatible with MIT OR Apache-2.0 dual release policy.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "MPL-2.0",
]  # the complete SPDX-2.6 short-list used by Zyntrix vendors.
confidence-threshold = 0.93
# Explicitly reject GPL/AGPL/LGPL/SSPL family — incompatible with our closed-system release model.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"  # our crate depends use explicit versions; dev-dependencies may use wildcards in CI crates.

[sources]
unknown-registry = "deny"
unknown-git = "deny"  # only first-party mirrors allowed; see Cargo.toml [patch] section.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
