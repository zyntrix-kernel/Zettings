name: ci

on:
  push:
    branches: [main, rebuild/v2]
  pull_request:

# Least privilege: gates only read the repository and its dependencies.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail fast on lockfile drift; updates are deliberate commits.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: rust gates (linux target)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install system libraries (documented in docs/setup/wsl2.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            libudev-dev \
            libdbus-1-dev \
            libpulse-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Cargo format
        run: cargo fmt --all --check

      - name: Cargo clippy (pedantic, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo tests
        run: cargo test --workspace

      - name: Regenerate bindings deterministically
        run: cargo test -p zettings-ipc --features export-bindings

      - name: Bindings must be up to date
        run: git diff --exit-code -- packages/ts-bindings/src/generated

  web:
    name: web gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # pnpm/action-setup@v6.0.10
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.18.0

      # actions/setup-node@v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit + accessibility tests
        run: pnpm -F zettings-web test
