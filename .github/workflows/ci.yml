name: ci

on:
  push:
    branches: [main, rebuild/v2]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail fast on lockfile drift; updates are deliberate commits.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: rust gates (linux target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install system libraries (documented in docs/setup/wsl2.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libpulse-dev libdbus-1-dev libudev-dev

      - name: Cargo format
        run: cargo fmt --all --check

      - name: Cargo clippy (pedantic, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo tests
        run: cargo test --workspace

      - name: Regenerate bindings deterministically
        run: cargo test -p zettings-ipc --features export-bindings

      - name: Bindings must be up to date
        run: git diff --exit-code -- packages/ts-bindings/src/generated

  web:
    name: web gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit + accessibility tests
        run: pnpm -F zettings-web test
