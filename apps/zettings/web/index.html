<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Zettings</title>
    <script>
      // Anti-flash theme resolution (DESIGN.md §9): runs before first paint.
      (function () {
        var mode = null;
        try {
          mode = localStorage.getItem("zettings.theme-mode");
        } catch (e) {}
        if (
          mode !== "light" &&
          mode !== "dark" &&
          mode !== "oled" &&
          mode !== "hc"
        ) {
          // system: CSS media queries resolve the appearance
        } else {
          document.documentElement.setAttribute("data-theme-mode", mode);
          document.documentElement.setAttribute("data-theme", mode);
        }
        // Wallpaper motion preference — validated allowlist, default live.
        var aurora = null;
        try {
          aurora = localStorage.getItem("zettings.wallpaper-motion");
        } catch (e) {}
        document.documentElement.setAttribute(
          "data-aurora",
          aurora === "static" ? "static" : "live"
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
