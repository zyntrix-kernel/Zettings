[package]
name = "zettings"
description = "ZETTINGS — system settings application shell for Zyntrix OS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Selects deterministic mock backend providers so the Windows host can run the
# full shell without Linux services. Real adapters ignore this flag.
zettings-mock = []
# Embeds the built web assets (frontendDist) instead of proxying build.devUrl;
# required for production-style runs (`cargo run --features custom-protocol`,
# enabled automatically by `tauri build`). Off by default so debug runs use
# the live Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zettings-core = { workspace = true }
zettings-ipc = { workspace = true }
zettings-backends = { workspace = true }
zettings-polkit = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
