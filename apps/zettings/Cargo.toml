[package]
name = "zettings"
description = "Zettings — next-generation system settings for Zyntrix OS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "zettings"
path = "src/main.rs"

[features]
default = []
# Mock backend for the Windows frontend dev loop. Off by default; the
# `pnpm dev` script enables it. Real Linux builds never enable it.
zettings-mock = [
    "zettings-core/zettings-mock",
    "zettings-polkit/zettings-mock",
    "zettings-search/zettings-mock",
    # The IPC crate gates its mock authorizer + mock backend forwards behind
    # this same flag; without it every write/read command returns
    # ServiceUnavailable on the dev loop.
    "zettings-ipc/zettings-mock",
]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
zettings-core = { workspace = true }
zettings-bus = { workspace = true }
zettings-ipc = { workspace = true }
zettings-polkit = { workspace = true }
zettings-plugin-sdk = { workspace = true }
zettings-palette = { workspace = true }
zettings-search = { workspace = true }
tauri = { workspace = true }
tauri-plugin-decorum = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
