[package]
name = "zettings-polkit"
description = "Per-action PolicyKit authorization for Zettings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# When `zettings-mock` is on, we use a local allow-all backend so the
# Windows frontend dev loop can exercise the IPC surface.
zettings-mock = []

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
zettings-bus = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[lints]
workspace = true
