[package]
name = "zettings-bridge"
description = "cxx-qt QObject bridges exposing Zettings Rust domain to QML"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx-qt = "0.10"
cxx-qt-lib = "0.10"

[build-dependencies]
cxx-qt-build = "0.10"

# Exception to AGENTS.md unsafe_code=forbid: build.rs needs one scoped
# unsafe for CxxQtBuilder::cc_builder (forced-include header). Clippy
# policy below mirrors [workspace.lints.clippy] verbatim; rust lints are
# restated with the single deliberate relaxation.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_fields_in_debug = "allow"
multiple_crate_versions = "allow"
