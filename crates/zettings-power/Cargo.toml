[package]
name = "zettings-power"
description = "UPower + power-profiles-daemon integration for Zettings (battery, charge thresholds, profiles)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# In-memory state-machine backend used for frontend iteration on Windows.
# The real `zbus` impl is compiled when `zettings-mock` is absent on Linux.
zettings-mock = []

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
zettings-bus = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
