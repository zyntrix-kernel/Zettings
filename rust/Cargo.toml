[package]
name = "zettings-backend"
version = "0.1.0"
edition = "2024"

# Standalone workspace: Zettings-app is independent of the (broken, legacy)
# parent workspace in the enclosing folder, which references obsolete Qt-era
# members outside this repository.
[workspace]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
zbus = "5.19.0"
zvariant = "5.15.0"
