# Static analysis configuration for Zettings.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - web/**
    - windows/**
    - linux/**

linter:
  rules:
    prefer_single_quotes: false
    avoid_print: true
    unnecessary_new: true
    unnecessary_const: true
    unnecessary_string_interpolations: true
